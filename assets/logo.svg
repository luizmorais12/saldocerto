<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sc-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="sc-accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <filter id="sc-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16A34A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)" filter="url(#sc-shadow)">
    <!-- Rounded Background Hexagon/Shield -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#sc-primary-grad)"/>
    
    <!-- Dynamic Upward Growth Arrow and Curve -->
    <path d="M16 42 L26 32 L34 38 L44 22" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 22 H44 V30" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Accent Currency Dot / Spark -->
    <circle cx="20" cy="24" r="3.5" fill="#DCFCE7"/>
  </g>

  <!-- Logo Text -->
  <g transform="translate(82, 45)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em" fill="#0F172A" class="sc-logo-title">
      Saldo<tspan fill="#16A34A">Certo</tspan>
    </text>
    <text y="19" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" letter-spacing="0.06em" fill="#64748B" class="sc-logo-tagline">
      SEU DINHEIRO NO CONTROLE
    </text>
  </g>
</svg>
